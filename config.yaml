# ------------------------------------------------------------
#  Memecoin sinyal botu - ayarlar
#  Bu dosyayı GitHub'da düzenleyerek filtreleri değiştirebilirsin.
#  Değişiklik bir sonraki çalışmada (≈10 dk) devreye girer.
# ------------------------------------------------------------

# Taranacak ağlar (DexScreener adları): solana, bsc, base
chains:
  - solana
  - bsc
  - base

# Aday coin kaynakları (true = açık, false = kapalı)
sources:
  dexscreener: true      # yeni profil ve boost listeleri (çoğunlukla ücretli tanıtım)
  geckoterminal: true    # trend ve yeni havuzlar (işlem hacmine dayalı, reklamsız)

# --- Piyasa filtreleri ---------------------------------------
market_cap_min: 100000        # $100K
market_cap_max: 10000000      # $10M
liquidity_min: 25000          # en az $25K likidite
liquidity_to_mc_min: 0.03     # likidite / MC en az %3
volume_24h_min: 50000         # 24 saatlik hacim en az $50K
age_hours_min: 12             # 12 saatten genç coinleri atla (pump.fun mezunlarının en kırılgan dönemi)
age_hours_max: 336            # 14 günden yaşlıları atla
price_change_24h_max: 300     # 24 saatte %300'den fazla uçmuşsa atla (zirve riski)
price_change_24h_min: -50     # 24 saatte %50'den fazla düşmüşse atla
h1_buy_sell_ratio_min: 1.0    # son 1 saatte alış sayısı >= satış sayısı
h1_txns_min: 30               # son 1 saatte en az 30 işlem (ölü coinleri ele)
h6_buy_sell_ratio_min: 0.9    # son 6 saatte alış/satış dengesi bu oranın altına düşmesin
max_h1_change: 60             # son 1 saatte %60'tan fazla uçmuşsa atla (tepeden giriş riski)
# Aşırı ısınma: ikisi birden olursa coin elenir (parabolik zirve göstergesi)
overheat_momentum: 8          # hacim ivmesi bu katın üzerindeyse
overheat_chg24: 100           # ve 24 saatlik artış bu yüzdeyi geçtiyse

# --- Güvenlik filtreleri -------------------------------------
# Solana: RugCheck  |  BSC/Base: GoPlus
require_security_check: true  # güvenlik verisi alınamazsa coini atla
top10_max_pct: 30             # (BSC/Base) ilk 10 holder en fazla %30
holders_min: 300              # bilinen holder sayısı en az 300
max_tax_pct: 10               # (BSC/Base) alış/satış vergisi en fazla %10
rugcheck_block_danger: true   # (Solana) "danger" seviyeli risk varsa atla
lp_locked_min_pct: 50         # likiditenin en az %50'si kilitli/yakılmış olsun (veri varsa)
creator_max_pct: 10           # coini çıkaran cüzdan arzın en fazla %10'unu tutsun (veri varsa)

# --- Sinyal kalitesi -----------------------------------------
score_min: 50                 # 100 üzerinden bu puanın altındakiler bildirilmez (70+ = A sinyali)
confirm_signals: true         # iki aşamalı onay: ilk geçişte izle, ikinci geçişte bildir
confirm_min_minutes: 15       # izlemeye alındıktan en erken bu kadar sonra bildir
confirm_max_hours: 12         # bu süreden eskiyen izleme kaydı sıfırlanır

# --- Bildirim ayarları ---------------------------------------
max_alerts_per_run: 5         # bir taramada en fazla 5 bildirim (spam önleme)
cooldown_hours: 24            # aynı coin için 24 saat içinde tekrar bildirim yok
report_lookback_days: 7       # günlük raporda son 7 günün sinyalleri
report_hour: 9                # rapor saati (Türkiye). Bu saatten sonraki ilk taramada gönderilir
track_days: 14                # sinyaller bu kadar gün fiyat takibinde kalır (zirve ölçümü)

# --- ERKEN GİRİŞ kategorisi (yüksek risk) --------------------
# Yeni doğmuş coinlerde "organik erken ilgi" arar: kısa sürede çok sayıda
# FARKLI alıcı + temiz kontrat + küçük insider/bundle payı.
erken:
  aktif: true
  chains: [solana]            # güvenlik kontrolü şimdilik sadece Solana
  new_pool_pages: 10          # GeckoTerminal "yeni havuz" listesinde kaç sayfa geriye gidilsin (en fazla 10)
  age_min_minutes: 2          # 2 dakikadan genç coinlere bakma (veri oturmamış)
  age_max_hours: 12           # 12 saatten yaşlıysa bu kategori değil
  mc_min: 30000               # $30K
  mc_max: 2000000             # $2M
  liq_min: 12000              # en az $12K likidite
  liq_to_mc_min: 0.05         # likidite / MC en az %5
  vol_h1_min: 20000           # 1 saatlik coinden beklenen hacim (gençlerde orantılı düşer)
  vol_young_min: 5000         # çok genç coinler için en düşük hacim tabanı
  buyers15_min: 150           # son 15 dakikada en az 150 FARKLI alıcı
  buyers_sellers_min: 2.0     # alıcı sayısı satıcının en az 2 katı
  lp_locked_min: 90           # LP en az %90 kilitli/yakılmış (launchpad havuzları hariç)
  # Bonding curve launchpad'leri: likiditeyi program tutar, kurucu çekemez.
  # Bu havuzlarda LP kilidi aranmaz; başka DEX'lerde kilit şartı devam eder.
  launchpad_dexes: [pump, launchlab, dbc, moonshot, bonk, believe, heaven, bags, boop, virtuals]
  insider_max_pct: 10         # RugCheck insider/bundle ağı arzın en fazla %10'u
  creator_max_pct: 3          # coini çıkaran cüzdan en fazla %3
  # VERİ MODU: ölçüm sonuçlarına göre bu kategori şu an bildirim göndermiyor,
  # sadece adayları ölçümleriyle kaydediyor. Bildirimleri açmak için: false yap.
  sadece_veri: true
  golge_gun: 3                # gölge kayıtları kaç gün fiyat takibinde kalsın
  max_alerts_per_run: 1       # taramada en fazla 1 erken giriş bildirimi
  max_alerts_per_day: 10      # günde en fazla 10 erken giriş bildirimi (spam kalkanı)
  cooldown_hours: 12          # aynı coin 12 saat içinde tekrar bildirilmez

# --- CÜZDAN TAKİBİ (zincir üstü, herkese açık veri) -----------
# FOMO'da öne çıkan trader'ların cüzdan adresleri. Bot bu cüzdanların
# ALIMLARINI görür ve gölge kaydı açar. Amaç: "bu kişiyi takip etmek
# gerçekten işe yarıyor mu" sorusunu birkaç hafta sonra veriyle yanıtlamak.
cuzdan_takip:
  aktif: true
  sadece_veri: true           # true = bildirim yok, sadece kayıt. Bildirim için: false
  cuzdanlar:
    - ad: CryptoKemal
      adres: Hpo766ufzaLce4FwvebarGDgFqMwnb2WKFkkUn7z3WLz
    - ad: artthatfucks
      adres: 5sAQHDFzem7erKy5u3H6zTU8dbrYjfkEzhgn3dnek5qe
  lookback_hours: 6           # son kaç saatlik alımlara bakılsın
  min_usd: 200                # bu tutarın altındaki alımlar ciddiye alınmaz
  mc_max: 5000000             # $5M üstü coinleri atla (bizim ilgi alanımız değil)
  max_kayit_per_run: 3        # taramada en fazla 3 yeni kayıt
  cooldown_hours: 24          # aynı coin 24 saat içinde tekrar kaydedilmez
