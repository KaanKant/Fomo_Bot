name: Sanal islem teshisi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Durumu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-sanal-${{ github.run_id }}
          restore-keys: state-

      - name: Analizi calistir
        run: python tani_sanal.py

      - name: Sonucu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SANAL-RAPORU.md SANAL-ISLEMLER.json
          git commit -m "Sanal islem teshisi" || echo "degisiklik yok"
          git push
