name: Cuzdan takibi teshisi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Teshisi calistir
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python tani_izle.py
      - name: Sonucu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IZLE-TANI.md
          git commit -m "Cuzdan takibi teshisi" || echo "degisiklik yok"
          git push
