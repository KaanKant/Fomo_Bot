name: Rapor teshisi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Durumu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-tani-${{ github.run_id }}
          restore-keys: state-

      - name: Teshisi calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tani_rapor.py

      - name: Sonucu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPOR-TANI.md
          git commit -m "Rapor teshisi" || echo "degisiklik yok"
          git push
