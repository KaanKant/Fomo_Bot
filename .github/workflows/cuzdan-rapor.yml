name: Cuzdan raporu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Raporlari uret
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python rapor_cuzdan.py
      - name: Depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUZDAN-*.md
          git commit -m "Cuzdan raporlari" || echo "degisiklik yok"
          git push
