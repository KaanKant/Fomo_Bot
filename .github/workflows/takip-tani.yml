name: Takip teshisi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Durumu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-takip-${{ github.run_id }}
          restore-keys: state-

      - name: Teshisi calistir
        run: python tani_takip.py

      - name: Sonucu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TAKIP-TANI.md
          git commit -m "Takip teshisi" || echo "degisiklik yok"
          git push
